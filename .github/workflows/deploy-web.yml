# Déploie la version web (PWA) sur GitHub Pages à chaque push.
# Prérequis (une seule fois) : Settings → Pages → Source : « GitHub Actions ».
# L'app sera servie sur https://<compte>.github.io/<nom-du-depot>/
name: Déployer la PWA sur GitHub Pages

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Servir l'app sous /<nom-du-depot>/ (GitHub Pages)
        run: |
          jq --arg base "/${{ github.event.repository.name }}" \
            '.expo.experiments.baseUrl = $base' app.json > app.json.tmp
          mv app.json.tmp app.json

      - name: Construire la version web
        run: npx expo export --platform web

      - name: Page 404 = index (routage côté client)
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # L'environnement github-pages n'accepte que la branche par défaut : sur une
  # branche de travail on s'arrête après le build (qui vérifie que l'export web
  # passe) plutôt que d'échouer au déploiement.
  deploy:
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
